<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#FDFCF8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bitter" />
    <meta name="description" content="Suivi de films minimaliste et analytique." />

    <link rel="icon" href="/favicon_io/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png" />

    <title>The Bitter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" crossorigin="anonymous">

    <!--
      CSS critique uniquement : évite un flash blanc avant le chargement de index.css
      (importé par index.tsx, qui contient Tailwind et le reste des styles).
    -->
    <style>
      body {
        background-color: #FDFCF8;
        color: #1A1A1A;
      }

      html.dark body {
        background-color: #0c0c0c;
        color: #FFFFFF;
      }

      /*
        Splash de lancement, réservé au mode standalone (app installée sur l'écran
        d'accueil). En onglet classique on est déjà dans un navigateur, un écran de
        chargement plein écran n'y aurait aucun sens.

        L'affichage est piloté par une media query plutôt que par du JS : le splash
        est ainsi peint dès la première frame, sans le flash qu'on aurait en
        l'ajoutant après coup. L'image passe par `background-image` pour qu'un
        fichier manquant laisse simplement le fond noir, sans icône d'image cassée.
      */
      #splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #0c0c0c;
        background-image: url('/icons/BitterLoadingScreen.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 1;
        transition: opacity 420ms ease;
      }

      @media (display-mode: standalone) {
        #splash { display: block; }
      }

      /* iOS ajouté à l'écran d'accueil : display-mode n'est pas toujours fiable. */
      html.is-standalone #splash { display: block; }

      #splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <script>
      // Doit rester avant la première peinture, sinon le splash apparaîtrait en retard.
      if (window.navigator.standalone === true) {
        document.documentElement.classList.add('is-standalone');
      }
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true"></div>
    <script>
      (function () {
        var splash = document.getElementById('splash');
        if (!splash) return;

        var standalone =
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true;

        if (!standalone) {
          splash.parentNode.removeChild(splash);
          return;
        }

        // Durée plancher pour que le logo soit vu même quand tout charge vite,
        // plafond de sécurité pour ne jamais bloquer l'app derrière le splash.
        var MIN_VISIBLE_MS = 1200;
        var MAX_VISIBLE_MS = 5000;
        var FADE_MS = 420;
        var shownAt = Date.now();
        var hidden = false;

        function hide() {
          if (hidden) return;
          hidden = true;
          splash.classList.add('is-hidden');
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, FADE_MS);
        }

        // Appelé par l'app une fois l'amorçage terminé (voir utils/splash.ts).
        function onReady() {
          setTimeout(hide, Math.max(0, MIN_VISIBLE_MS - (Date.now() - shownAt)));
        }
        window.__bitterSplashReady = onReady;

        // Filet : l'app a pu se déclarer prête avant l'exécution de ce script.
        if (window.__bitterAppReady === true) onReady();

        setTimeout(hide, MAX_VISIBLE_MS);
      })();
    </script>
    <div class="grain-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
